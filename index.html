<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Bloom</title>
<meta name="description" content="A square of paper, four corners folded to the middle, a hibiscus drawn across the face. Open it and it's a letter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// PAYLOAD SCHEMA v1 — append-only. Never rename a key or change its meaning.
// Always default missing keys, so v1 links still open in v9.
//   v — schema version
//   o — opening line        b — body        s — sign-off        f — bloom name
const DEFAULTS = {
  v: 1,
  o: 'hi,',
  b: "this is a tiny reminder that you're special to me.\n\nTake care, smile a little, and think of me sometimes",
  s: 'always,',
  f: 'hibiscus'
};
</script>
<style>
/* ============================================================
   Paper Bloom
   A blintz-folded square: four corner triangles hinge onto a
   centre diamond. The letter is on their fronts, the hibiscus
   on their backs — so opening it splits the flower into
   quarters and swings them away.
   ============================================================ */

@property --fold { syntax: '<angle>'; inherits: false; initial-value: 180deg; }
@property --peel { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root{
  /* paper + ink */
  --paper:      #fbf4e6;
  --paper-warm: #f3e8d2;
  --page:       #efe7d8;
  --page-2:     #e7ddca;

  /* hibiscus (default bloom) */
  --petal-rim:  #ffd479;
  --petal-tip:  #fdb63f;
  --petal-mid:  #f2872f;
  --petal-in:   #e04a35;
  --petal-core: #ab1f4e;
  --vein:       #c2384c;
  --stamen:     #f6c445;
  --leaf:       #55794a;
  --leaf-2:     #375b35;

  --ease: cubic-bezier(.19,.87,.28,1);
  /* --S is the folded square itself. The bloom is drawn 1.4x that and
     overhangs the paper on every side, so the stage reserves 1.6x. */
  --S: clamp(190px, min(56vmin, 44vh), 500px);
  --stage: calc(var(--S) * 1.7);
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(120% 90% at 50% 8%, #f7f0e2 0%, var(--page) 46%, var(--page-2) 100%)
    fixed;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  overflow-x:hidden;
}

/* paper grain */
.grain{
  position:fixed; inset:0; z-index:9; pointer-events:none;
  opacity:.42; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
}

.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

/* ---------- layout ---------- */
.page{
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(1.6rem,4vmin,3rem);
  padding:clamp(1rem,4vmin,2.5rem);
}

/* ---------- the stage ---------- */
/* the stage is larger than the sheet so the overhanging petals and leaves
   have somewhere to live without colliding with the picker below */
.scene{
  width:var(--stage); height:var(--stage);
  perspective:2400px; perspective-origin:50% 46%;
  display:grid; place-items:center;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  /* the bloom SVGs paint outside their viewBox; without this their bounds
     leak into the page's scroll area and the viewport gains a scrollbar */
  overflow:clip;
}
.scene:focus-visible{ outline:2px solid var(--petal-in); outline-offset:-4px; border-radius:10px; }

.sheet{
  position:relative; width:var(--S); height:var(--S);
  transform-style:preserve-3d;
  transform:scale(1.05) rotate(-3deg);
  transition:transform 1.15s var(--ease), filter 1.15s var(--ease);
  filter:drop-shadow(0 24px 30px rgba(76,52,30,.20)) drop-shadow(0 3px 7px rgba(76,52,30,.13));
}
.sheet.open{
  transform:scale(1) rotate(0deg);
  filter:drop-shadow(0 16px 30px rgba(76,52,30,.16)) drop-shadow(0 2px 4px rgba(76,52,30,.10));
}

/* the immobile centre diamond */
.core{
  position:absolute; inset:0;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}

/* corner flaps */
.flap{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transform-origin:var(--ox) var(--oy);
  transform:translateZ(var(--z)) rotate3d(var(--ax),var(--ay),0,calc(var(--fold) * var(--s)));
  transition:--fold 1s var(--ease) var(--d);
}
.sheet.open .flap{ --fold:0deg; }

.face{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
/* letter side: the flat corner triangle, in flap-local coordinates */
.face-letter{ clip-path:var(--clip); }
/* flower side: pre-rotated so it composes to identity while the flap is
   folded, which means it is authored in sheet coordinates and clipped to
   the quarter of the centre diamond that this flap covers when shut. */
.face-bloom{
  clip-path:var(--clipd);
  transform-origin:var(--ox) var(--oy);
  transform:rotate3d(var(--ax),var(--ay),0,calc(180deg * var(--s)));
  background:
    radial-gradient(150% 150% at 50% 50%, rgba(120,88,52,.10) 0%, rgba(120,88,52,0) 46%),
    radial-gradient(120% 110% at 26% 16%, #fdf8ec 0%, var(--paper) 50%, var(--paper-warm) 100%);
}

/* Everything of the bloom that falls outside the folded diamond. The clip
   reaches well past the sheet so petals can overhang the paper entirely —
   that overhang is what hides the diamond's four corners. */
.fringe{
  position:absolute; inset:0;
  clip-path:var(--clipf);
  transform-origin:var(--ox) var(--oy);
  transform:translateZ(2.4px) rotate3d(var(--ax),var(--ay),0,calc(var(--peel) * var(--s) * -1));
  transition:--peel .95s var(--ease) var(--d), opacity .5s ease-out var(--d);
}
.sheet.open .fringe{ --peel:145deg; opacity:0; }

/* per-flap geometry.
   --clip   outer corner triangle (the flap lying flat)
   --clipd  quarter of the centre diamond it covers when folded shut
   --clipf  its share of everything outside the diamond, extended off-sheet
   --ox/--oy hinge midpoint, --ax/--ay hinge axis, --s fold direction       */
.f-nw{ --ox:25%; --oy:25%; --ax:-1; --ay:1; --s:1;  --z:1.6px; --d:0ms;
       --clip:polygon(0 0,50% 0,0 50%);
       --clipd:polygon(50% 50%,50% 0,0 50%);
       --clipf:polygon(50% 0,0 50%,-60% 50%,-60% -60%,50% -60%); }
.f-ne{ --ox:75%; --oy:25%; --ax:1;  --ay:1; --s:-1; --z:1.2px; --d:90ms;
       --clip:polygon(100% 0,100% 50%,50% 0);
       --clipd:polygon(50% 50%,50% 0,100% 50%);
       --clipf:polygon(50% 0,100% 50%,160% 50%,160% -60%,50% -60%); }
.f-se{ --ox:75%; --oy:75%; --ax:-1; --ay:1; --s:-1; --z:.8px;  --d:180ms;
       --clip:polygon(100% 100%,50% 100%,100% 50%);
       --clipd:polygon(50% 50%,100% 50%,50% 100%);
       --clipf:polygon(100% 50%,50% 100%,50% 160%,160% 160%,160% 50%); }
.f-sw{ --ox:25%; --oy:75%; --ax:1;  --ay:1; --s:1;  --z:.4px;  --d:270ms;
       --clip:polygon(0 100%,0 50%,50% 100%);
       --clipd:polygon(50% 50%,0 50%,50% 100%);
       --clipf:polygon(0 50%,50% 100%,50% 160%,-60% 160%,-60% 50%); }

/* artwork fills its host exactly, and may spill past it */
.art{ position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible; }

/* ---------- petals drift under the cursor ----------
   Each petal pivots a degree or two about the flower's centre, so the tips
   swing side to side while the throat stays put.
   The bloom is painted by eight separate SVGs — four flap backs and four
   fringes — that together make one flower, so timing is keyed to the petal's
   index rather than the copy: petal 3 of the fringe and petal 3 of the flap
   behind it share an amplitude, duration and phase and never drift apart. */
.sway{ transform-box:view-box; transform-origin:100px 100px; }

.scene:hover .sheet:not(.open) .sway,
.scene:focus-visible .sheet:not(.open) .sway{
  animation-name:petal-sway;
  animation-duration:var(--dur);
  animation-delay:var(--ph);           /* negative: starts mid-cycle */
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
@keyframes petal-sway{
  0%,100%{ transform:rotate(calc(var(--amp) * -1)); }
  50%    { transform:rotate(var(--amp)); }
}
/* ---------- letter face ---------- */
.lc{
  position:absolute; inset:0;
  background:radial-gradient(115% 100% at 30% 12%, #fdf8ec 0%, var(--paper) 44%, var(--paper-warm) 100%);
  overflow:hidden;
}
/* each folded panel catches the light differently */
.lc::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(var(--tilt,150deg),
    rgba(255,255,255,.5), rgba(255,255,255,0) 52%, rgba(122,90,54,.075));
}
.f-nw .lc{ --tilt:132deg; } .f-ne .lc{ --tilt:228deg; }
.f-se .lc{ --tilt:312deg; } .f-sw .lc{ --tilt:48deg; }

.lc-text{
  position:absolute; inset:7%;
  display:flex; align-items:center;
  font-family:"Caveat","Bradley Hand","Segoe Script",cursive;
  color:#41352a;
  /* --fit is trimmed by script so any length of letter stays inside */
  font-size:calc(var(--S) * .052 * var(--fit,1));
  line-height:1.46;
  letter-spacing:.005em;
  overflow-wrap:break-word;   /* a very long word can't outgrow the sheet */
  transform:rotate(-1.1deg);
}
.lc-inner{ width:100%; }
.lc-open{ margin:0 0 .3em; }
.lc-body{ margin:0; white-space:pre-line; }
.lc-sign{ margin:.9em 0 0; text-align:right; padding-right:5%; }
.lc-text p{ text-shadow:0 .5px 0 rgba(255,255,255,.5); }

/* ---------- bloom picker ---------- */
.blooms{ display:flex; align-items:center; gap:.8rem; }
.swatch{
  width:28px; height:28px; padding:0; border-radius:50%; cursor:pointer;
  border:1px solid rgba(43,35,28,.16);
  box-shadow:inset 0 0 0 2px var(--paper);
  transition:transform .3s var(--ease), box-shadow .3s;
}
.swatch:hover{ transform:scale(1.12); }
.swatch[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--paper),0 0 0 1.5px #2b231c; }
.swatch:focus-visible{ outline:2px solid #2b231c; outline-offset:3px; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
}

/* ============================================================
   Compose modal — Phase 3 addition, appended only.
   Nothing above this block was changed.
   ============================================================ */

.write-own{
  border:1px solid rgba(43,35,28,.22); background:var(--paper);
  color:#41352a; font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:.7em 1.4em; border-radius:999px; cursor:pointer;
  transition:transform .3s var(--ease), box-shadow .3s;
}
.write-own:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(76,52,30,.16); }
.write-own:focus-visible{ outline:2px solid #2b231c; outline-offset:3px; }

body.compose-open{ overflow:hidden; }

.compose-backdrop{
  position:fixed; inset:0; z-index:50;
  background:rgba(41,32,22,.45); backdrop-filter:blur(2px);
}
.compose-backdrop[hidden]{ display:none; }

.compose-modal{
  position:fixed; inset:0; z-index:51;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(.75rem,4vw,2rem);
  overflow-y:auto;
}
.compose-modal[hidden]{ display:none; }

.compose-panel{
  position:relative; width:min(94vw,880px); max-height:90vh; overflow-y:auto;
  background:var(--paper); border-radius:16px;
  padding:clamp(1.25rem,4vw,2rem);
  box-shadow:0 24px 60px rgba(41,32,22,.35);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#41352a;
}

.compose-x{
  position:absolute; top:.9rem; right:.9rem;
  width:32px; height:32px; border-radius:50%; border:1px solid rgba(43,35,28,.18);
  background:transparent; color:#41352a; font-size:1.3rem; line-height:1; cursor:pointer;
}
.compose-x:hover{ background:rgba(43,35,28,.06); }
.compose-x:focus-visible{ outline:2px solid #2b231c; outline-offset:2px; }

.compose-title{ margin:0 2.4rem .9rem 0; font-size:1.3rem; }

.compose-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(1rem,3vw,2rem); align-items:start; }

.compose-field{ margin-bottom:1rem; }
.compose-field-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:.35rem; }
.compose-field-head label,
.compose-field-head span:first-child{ font-size:.85rem; font-weight:600; }
.compose-count{ font-size:.75rem; color:#8a7357; }
.compose-count.is-warn{ color:#b5651d; }

.compose-form input[type="text"],
.compose-form textarea,
.compose-link input[type="text"]{
  width:100%; font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#41352a; background:#fff; border:1px solid rgba(43,35,28,.2); border-radius:8px;
  padding:.55em .7em; resize:vertical;
}
.compose-form input[type="text"]:focus-visible,
.compose-form textarea:focus-visible,
.compose-link input[type="text"]:focus-visible{
  outline:2px solid #2b231c; outline-offset:1px;
}

.compose-create,
.compose-copy,
.compose-back{
  border:1px solid rgba(43,35,28,.22); background:#2b231c; color:#fbf4e6;
  font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:.65em 1.3em; border-radius:999px; cursor:pointer; margin-top:.25rem;
}
.compose-create:hover, .compose-copy:hover, .compose-back:hover{ opacity:.88; }
.compose-create:focus-visible, .compose-copy:focus-visible, .compose-back:focus-visible{
  outline:2px solid #2b231c; outline-offset:3px;
}
.compose-create:disabled{
  opacity:.4; cursor:not-allowed;
}
.compose-create:disabled:hover{ opacity:.4; }

.compose-link-actions{ display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; margin:.6rem 0; }
.compose-preview-link{ color:#7a5a36; font-size:.9rem; }
.compose-preview-link:focus-visible{ outline:2px solid #2b231c; outline-offset:2px; }
.compose-copy-status{ font-size:.85rem; color:#5b7a4d; }

/* .scene is a fixed --stage x --stage square that's meant to be shrunk to
   fit this box. A flex/grid container won't do that cleanly: .scene has
   overflow:clip, which zeroes its automatic min-width for shrink purposes
   on the main axis only, so a flex parent shrinks its width but not its
   height, warping the square before the scale is even applied. Taking
   .scene out of flow with absolute positioning sidesteps that entirely —
   both axes stay exactly --stage, and translate(-50%,-50%) plus scale()
   centers the now-uniformly-shrunk square in the box. */
.compose-preview-wrap{
  position:relative;
  width:calc(var(--stage) * .58); height:calc(var(--stage) * .58);
  margin:0 auto; overflow:hidden;
}
.compose-preview-wrap .scene{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(.58);
}

@media (max-width:719px){
  .compose-grid{ grid-template-columns:1fr; }
  .compose-right{ order:-1; margin-bottom:.5rem; }
  .compose-preview-wrap{ width:calc(var(--stage) * .46); height:calc(var(--stage) * .46); }
  .compose-preview-wrap .scene{ transform:translate(-50%,-50%) scale(.46); }
}

/* ============================================================
   Phase 5 addition — appended only.
   9 flowers now share the swatch row; let it wrap onto two rows
   instead of overflowing the compose panel.
   ============================================================ */
.blooms{ flex-wrap:wrap; }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- ===================== templates ===================== -->

<template id="tpl-letter">
  <div class="lc">
    <svg class="art" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="lcv" cx="34%" cy="16%" r="96%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".5"/>
          <stop offset="62%" stop-color="#fff" stop-opacity="0"/>
          <stop offset="100%" stop-color="#8a6a44" stop-opacity=".14"/>
        </radialGradient>
      </defs>
      <rect width="200" height="200" fill="url(#lcv)"/>
      <!-- No drawn creases: the only fold this sheet makes is the diamond,
           and that already reads from the per-panel lighting below. -->
      <path d="M100 0 200 100 100 200 0 100Z" fill="#8a6a44" opacity=".026"/>
    </svg>
    <div class="lc-text">
      <div class="lc-inner">
        <p class="lc-open"></p>
        <p class="lc-body"></p>
        <p class="lc-sign"></p>
      </div>
    </div>
  </div>
</template>

<!-- ===================== page ===================== -->
<main class="page">

  <div class="scene" id="scene" role="button" tabindex="0"
       aria-expanded="false"
       aria-label="Paper flower. Activate to unfold it into a letter.">
    <div class="sheet" id="sheet">
      <div class="core" data-letter></div>

      <div class="flap f-nw">
        <div class="face face-letter" data-letter></div>
        <div class="face face-bloom" data-bloom></div>
      </div>
      <div class="flap f-ne">
        <div class="face face-letter" data-letter></div>
        <div class="face face-bloom" data-bloom></div>
      </div>
      <div class="flap f-se">
        <div class="face face-letter" data-letter></div>
        <div class="face face-bloom" data-bloom></div>
      </div>
      <div class="flap f-sw">
        <div class="face face-letter" data-letter></div>
        <div class="face face-bloom" data-bloom></div>
      </div>

      <div class="fringe f-nw" data-bloom></div>
      <div class="fringe f-ne" data-bloom></div>
      <div class="fringe f-se" data-bloom></div>
      <div class="fringe f-sw" data-bloom></div>
    </div>
  </div>

  <!-- the letter, once, for screen readers -->
  <div class="sr-only">
    <p class="sr-open"></p>
    <p class="sr-body"></p>
    <p class="sr-sign"></p>
  </div>

  <button class="write-own" id="writeOwnBtn" type="button">Write your own</button>

</main>

<!-- ===================== compose modal ===================== -->
<div class="compose-backdrop" id="composeBackdrop" hidden></div>
<div class="compose-modal" id="composeModal" role="dialog" aria-modal="true" aria-labelledby="composeTitle" hidden>
  <div class="compose-panel">
    <button class="compose-x" id="composeCloseBtn" type="button" aria-label="Close">&times;</button>
    <h2 class="compose-title" id="composeTitle">Write your own</h2>

    <div class="compose-grid">
      <div class="compose-left">

        <div class="compose-form" id="composeFormView">
          <div class="compose-field">
            <div class="compose-field-head">
              <label for="fieldOpen">Opening</label>
              <span class="compose-count" id="countOpen">0 / 40</span>
            </div>
            <input type="text" id="fieldOpen" maxlength="40" placeholder="hi," required aria-required="true">
          </div>

          <div class="compose-field">
            <div class="compose-field-head">
              <label for="fieldBody">Body</label>
              <span class="compose-count" id="countBody">0 / 500</span>
            </div>
            <textarea id="fieldBody" rows="6" maxlength="500" required aria-required="true"></textarea>
          </div>

          <div class="compose-field">
            <div class="compose-field-head">
              <label for="fieldSign">Signature</label>
              <span class="compose-count" id="countSign">0 / 40</span>
            </div>
            <input type="text" id="fieldSign" maxlength="40" placeholder="always," required aria-required="true">
          </div>

          <div class="compose-field">
            <div class="compose-field-head"><span>Flower</span></div>
            <div class="blooms" id="composeBlooms"></div>
          </div>

          <button class="compose-create" id="composeCreateBtn" type="button" disabled>Create link</button>
        </div>

        <div class="compose-link" id="composeLinkView" hidden>
          <div class="compose-field">
            <div class="compose-field-head"><label for="linkOutput">Your link</label></div>
            <input type="text" id="linkOutput" readonly>
          </div>
          <div class="compose-link-actions">
            <button class="compose-copy" id="copyLinkBtn" type="button">Copy link</button>
            <a class="compose-preview-link" id="previewLinkBtn" href="#" target="_blank" rel="noopener noreferrer">Preview what they'll see</a>
            <span class="compose-copy-status" id="copyStatus" aria-live="polite"></span>
          </div>
          <button class="compose-back" id="backToEditBtn" type="button">Back to editing</button>
        </div>

      </div>

      <div class="compose-right">
        <div class="compose-preview-wrap">
          <div class="scene" id="previewScene" role="button" tabindex="0"
               aria-expanded="false"
               aria-label="Preview flower. Activate to unfold it into a letter.">
            <div class="sheet" id="previewSheet">
              <div class="core" data-letter></div>

              <div class="flap f-nw">
                <div class="face face-letter" data-letter></div>
                <div class="face face-bloom" data-bloom></div>
              </div>
              <div class="flap f-ne">
                <div class="face face-letter" data-letter></div>
                <div class="face face-bloom" data-bloom></div>
              </div>
              <div class="flap f-se">
                <div class="face face-letter" data-letter></div>
                <div class="face face-bloom" data-bloom></div>
              </div>
              <div class="flap f-sw">
                <div class="face face-letter" data-letter></div>
                <div class="face face-bloom" data-bloom></div>
              </div>

              <div class="fringe f-nw" data-bloom></div>
              <div class="fringe f-ne" data-bloom></div>
              <div class="fringe f-se" data-bloom></div>
              <div class="fringe f-sw" data-bloom></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>

/** Build one bloom SVG. `u` must be unique per instance on the page. */
function renderBloomSVG(f, u) {
  const petal = PETALS[f.petal];
  const r = f.ramp || [0, 8, 20, 60, 88];
  let i = 0;
  const rings = f.rings.map(([n, rs, off]) => {
    const petals = Array.from({ length: n }, (_, k) => {
      const a = off + k * 360 / n;
      return `<g transform="rotate(${a.toFixed(2)} 100 100)"><g class="sway" style="${swayVars(i++)}">

        <use href="#petal${u}" fill="url(#lap${u})"/>
        <g clip-path="url(#pclip${u})"><use href="#veins${u}"/></g>
        <use href="#petal${u}" fill="none" stroke="var(--petal-edge)" stroke-opacity=".34" stroke-width="1"/>

    }).join('');
    return `<g transform="translate(100 100) scale(${rs}) translate(-100 -100)">${petals}</g>`;

  <defs>
    <radialGradient id="pg${u}" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="88">

      <stop offset="0%" stop-color="var(--petal-core)"/>
      <stop offset="62%" stop-color="var(--petal-core)" stop-opacity=".55"/>
      <stop offset="100%" stop-color="var(--petal-core)" stop-opacity="0"/>

    <path id="petal${u}" d="${petal.d}"/>

        <path d="M100 100C92 79 76 56 60 36"/><path d="M100 100C108 79 124 56 140 36"/>
        <path d="M100 100C90 82 70 66 52 54"/><path d="M100 100C110 82 130 66 148 54"/>
      </g>
      <g stroke-opacity=".2" stroke-width=".6">
        <path d="M100 100C98 77 96 48 94 17"/><path d="M100 100C102 77 104 48 106 17"/>
        <path d="M100 100C94 78 80 53 66 30"/><path d="M100 100C106 78 120 53 134 30"/>
        <path d="M100 100C91 81 73 61 56 45"/><path d="M100 100C109 81 127 61 144 45"/>
      </g>
    </g>
    <g id="leaf${u}">${LEAF}</g>
  </defs>

  <!-- backing polygon: the folded paper diamond, filled with the petal ramp,
       so any gap between petals reads as flower rather than paper -->
  <polygon points="100,0 200,100 100,200 0,100" fill="url(#pg${u})"/>

  <g transform="translate(100 100) rotate(${f.tilt}) scale(${f.scale}) translate(-100 -100)">

}

/** Derive the 9 CSS variables from a flower's 3 anchor colours. */
function bloomVars(f) {
  if (f.vars) return f.vars;
  return {
    '--petal-rim':  `color-mix(in oklch, ${f.tip} 80%, white)`,
    '--petal-tip':  f.tip,
    '--petal-mid':  `color-mix(in oklch, ${f.tip} 62%, ${f.core})`,
    '--petal-in':   `color-mix(in oklch, ${f.tip} 30%, ${f.core})`,
    '--petal-core': f.core,
    '--vein':       `color-mix(in oklch, ${f.core} 74%, ${f.tip})`,
    '--petal-edge': `color-mix(in oklch, ${f.core} 40%, ${f.tip})`,
    '--stamen':     f.stamen || `color-mix(in oklch, ${f.tip} 62%, #f6c445)`,
    '--leaf':       f.leaf,
    '--leaf-2':     `color-mix(in oklch, ${f.leaf} 68%, black)`
  };
}

(() => {
  'use strict';

  /* ---------- clone artwork into every face ---------- */
  const tplLetter = document.getElementById('tpl-letter').content;

  /* The letter is painted onto all five panels of the sheet, so none of them
     are exposed to assistive tech — the sr-only copy carries the text once. */
  document.querySelectorAll('[data-letter]').forEach(host => {
    host.appendChild(tplLetter.cloneNode(true));
    host.setAttribute('aria-hidden', 'true');
  });

  const root = document.documentElement;

  /* ---------- letter text ---------- */
  /* Payload keys map onto the panel classes, and every panel carries the same
     copy — .lc-* is the painted text, .sr-* the one screen-reader copy. */
  const TEXT_KEYS = { o: 'open', b: 'body', s: 'sign' };

  function render(config) {
    for (const [key, part] of Object.entries(TEXT_KEYS)) {
      const text = config[key] ?? DEFAULTS[key];
      document.querySelectorAll(`.lc-${part}, .sr-${part}`)
        .forEach(el => { el.textContent = text; });
    }
    queueRefit();                           // new copy rewraps: resize to the sheet, debounced
  }

  /* Size the handwriting to the sheet in both directions: a long letter is
     shrunk until it clears the square, a short one is grown until it fills it.
     Resizing the type also rewraps it, so height is not linear in font size —
     binary-search the largest scale that still fits rather than stepping.
     Measured on the centre panel; every copy carries the same text. */
  const FIT_MIN = .38, FIT_MAX = 2.1;
  const probeBox   = document.querySelector('.core .lc-text');
  const probeInner = document.querySelector('.core .lc-inner');

  function refit() {
    if (!probeBox || !probeInner) return;
    const fits = v => {
      root.style.setProperty('--fit', v);
      return probeInner.offsetHeight <= probeBox.clientHeight;
    };
    if (fits(FIT_MAX)) return;            // a few words: let them run large
    let lo = FIT_MIN, hi = FIT_MAX;
    for (let i = 0; i < 11; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) lo = mid; else hi = mid;
    }
    fits(lo);
  }

  let fitPending = 0;
  const queueRefit = () => {
    cancelAnimationFrame(fitPending);
    fitPending = requestAnimationFrame(refit);
  };

  /* ---------- shareable link ----------
     The letter travels in the URL hash as base64url JSON: #<payload>. The
     hash is never sent to the server, which is the whole privacy property
     of this design — never move this to a query string. TextEncoder /
     TextDecoder (not btoa(JSON.stringify(x))) are what let this survive
     emoji and non-Latin text. */
  function toBase64Url(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function fromBase64Url(str) {
    const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
    const bin = atob(b64 + pad);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function encode(config) {
    return toBase64Url(new TextEncoder().encode(JSON.stringify(config)));
  }

  // Malformed input throws here — callers decide how to handle it, this
  // function never swallows the error.
  function decode(str) {
    const bytes = fromBase64Url(str);
    const json = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    const obj = JSON.parse(json);
    if (!obj || typeof obj !== 'object') throw new TypeError('payload is not an object');
    return obj;
  }

  // Always returns a valid, safe config; never throws. `f` is checked
  // against FLOWERS below, once that table exists.
  function sanitize(raw) {
    const src = raw && typeof raw === 'object' ? raw : {};
    const clamp = (v, fallback, max) => (typeof v === 'string' ? v : fallback).slice(0, max);
    return {
      v: DEFAULTS.v,
      o: clamp(src.o, DEFAULTS.o, 40),
      b: clamp(src.b, DEFAULTS.b, 500),
      s: clamp(src.s, DEFAULTS.s, 40),
      f: typeof src.f === 'string' && src.f in FLOWERS ? src.f : DEFAULTS.f
    };
  }

  /* ---------- the fold ---------- */
  const scene = document.getElementById('scene');
  const sheet = document.getElementById('sheet');

  function setOpen(open) {
    sheet.classList.toggle('open', open);
    scene.setAttribute('aria-expanded', String(open));
    scene.setAttribute('aria-label', open
      ? 'Open letter. Activate to fold it back into a flower.'
      : 'Paper flower. Activate to unfold it into a letter.');
  }

  scene.addEventListener('click', () => setOpen(!sheet.classList.contains('open')));
  scene.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setOpen(!sheet.classList.contains('open'));
    }
  });

  /* ---------- blooms ---------- */
  const composeBloomsEl = document.getElementById('composeBlooms');
  composeBloomsEl.innerHTML = Object.entries(FLOWERS).map(([key, f]) =>
    `<button class="swatch" data-bloom-set="${key}" aria-pressed="false" aria-label="${f.label}"
             style="background:conic-gradient(${f.swatch[0]},${f.swatch[1]},${f.swatch[0]})"></button>`
  ).join('');

  /* A module-level counter, never reset: every one of the 8 [data-bloom]
     hosts on the page gets its own uid on every render, so their <defs>
     ids (pg/petal/pclip/veins/throat/lap/leaf) never collide — collision
     would make url(#pg) resolve to whichever copy came first in the DOM. */
  let bloomUid = 0;

  /* An unknown name falls back to the default bloom rather than throwing, so a
     link written against a later schema still opens. */
  function applyBloom(name) {
    const key = name in FLOWERS ? name : DEFAULTS.f;
    const flower = FLOWERS[key];
    for (const [k, v] of Object.entries(bloomVars(flower)))
      root.style.setProperty(k, v);
    document.querySelectorAll('[data-bloom]').forEach(host => {
      host.innerHTML = renderBloomSVG(flower, ++bloomUid);
    });
    document.querySelectorAll('[data-bloom-set]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.bloomSet === key)));
  }

  document.querySelectorAll('[data-bloom-set]').forEach(btn => {
    btn.addEventListener('click', () => applyBloom(btn.dataset.bloomSet));
  });

  /* A small, dismissible notice for a hash that couldn't be read. Styled
     inline rather than in the stylesheet — this is a temporary, JS-driven
     affordance, not part of the page's design. */
  function showLinkNotice() {
    const bar = document.createElement('div');
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);'
      + 'display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;border-radius:10px;'
      + 'background:var(--paper);border:1px solid rgba(43,35,28,.18);color:#41352a;'
      + 'font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;'
      + 'box-shadow:0 8px 20px rgba(76,52,30,.18);z-index:10;';
    const msg = document.createElement('span');
    msg.textContent = "This letter's link seems incomplete.";
    const dismiss = document.createElement('button');
    dismiss.type = 'button';
    dismiss.textContent = 'Dismiss';
    dismiss.style.cssText = 'border:0;background:none;color:#8a6a44;font:inherit;'
      + 'text-decoration:underline;cursor:pointer;padding:0;';
    dismiss.addEventListener('click', () => bar.remove());
    bar.append(msg, dismiss);
    document.body.appendChild(bar);
  }

  // Reads location.hash and decides what to show. No hash (or a bare #)
  // renders DEFAULTS. A malformed hash is caught here — never left to
  // surface as a blank page or an uncaught console error.
  function boot() {
    const raw = location.hash.slice(1);
    let config = DEFAULTS;
    if (raw) {
      try {
        config = sanitize(decode(raw));
      } catch {
        showLinkNotice();
      }
    }
    render(config);
    applyBloom(config.f);
  }
  boot();

  /* ---------- temporary: run window.__selftest() in the console ---------- */
  window.__selftest = function () {
    const results = [];
    const check = (name, pass) => results.push({ name, pass });
    const deepEqual = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    const roundtripCases = [
      { v: 1, o: 'hi,', b: 'plain ascii body', s: 'always,', f: 'hibiscus' },
      { v: 1, o: 'sayang,', b: 'Jaga diri ya 🌺', s: 'selalu,', f: 'poppy' },
      { v: 1, o: 'こんにちは', b: '大切なあなたへ、いつも笑顔でいてね。', s: 'いつも、', f: 'cosmos' },
      { v: 1, o: 'hi,', b: 'x'.repeat(500), s: 'always,', f: 'magnolia' },
      { v: 1, o: '', b: '', s: '', f: 'hibiscus' }
    ];
    roundtripCases.forEach((x, i) => {
      try { check(`roundtrip[${i}]`, deepEqual(decode(encode(x)), x)); }
      catch { check(`roundtrip[${i}]`, false); }
    });

    try {
      const truncated = encode({ v: 1, o: 'hi,', b: 'x'.repeat(80), s: 'always,', f: 'hibiscus' }).slice(0, -10);
      let threw = false;
      try { decode(truncated); } catch { threw = true; }
      check('truncated payload is caught, not thrown to caller code', threw);
    } catch { check('truncated payload is caught, not thrown to caller code', false); }

    try {
      const s = sanitize({ b: 'x'.repeat(9999), f: 'nonsense' });
      check('sanitize clamps body to 500 and falls back to hibiscus', s.b.length === 500 && s.f === 'hibiscus');
    } catch { check('sanitize clamps body to 500 and falls back to hibiscus', false); }

    let allPass = true;
    results.forEach(r => {
      console.log(`${r.pass ? 'PASS' : 'FAIL'} — ${r.name}`);
      if (!r.pass) allPass = false;
    });
    console.log(allPass ? 'all tests passed' : 'some tests failed');
    return allPass;
  };

  /* ---------- compose modal ---------- */
  const writeOwnBtn     = document.getElementById('writeOwnBtn');
  const composeBackdrop = document.getElementById('composeBackdrop');
  const composeModal    = document.getElementById('composeModal');
  const composeCloseBtn = document.getElementById('composeCloseBtn');
  const composeFormView = document.getElementById('composeFormView');
  const composeLinkView = document.getElementById('composeLinkView');
  const composeCreateBtn = document.getElementById('composeCreateBtn');
  const backToEditBtn   = document.getElementById('backToEditBtn');
  const copyLinkBtn     = document.getElementById('copyLinkBtn');
  const previewLinkBtn  = document.getElementById('previewLinkBtn');
  const linkOutput      = document.getElementById('linkOutput');
  const copyStatus      = document.getElementById('copyStatus');
  const fieldOpen = document.getElementById('fieldOpen');
  const fieldBody = document.getElementById('fieldBody');
  const fieldSign = document.getElementById('fieldSign');
  const countOpen = document.getElementById('countOpen');
  const countBody = document.getElementById('countBody');
  const countSign = document.getElementById('countSign');

  const OPEN_MAX = 40, BODY_MAX = 500, SIGN_MAX = 40;   // mirrors sanitize()'s own clamps

  function clampField(el, max) {
    if (el.value.length > max) el.value = el.value.slice(0, max);
  }
  function updateCount(el, counterEl, max) {
    const len = el.value.length;
    counterEl.textContent = `${len} / ${max}`;
    counterEl.classList.toggle('is-warn', len / max >= .9);
  }
  function composedConfig() {
    const pressed = document.querySelector('#composeBlooms [data-bloom-set][aria-pressed="true"]');
    return {
      v: DEFAULTS.v,
      o: fieldOpen.value,
      b: fieldBody.value,
      s: fieldSign.value,
      f: pressed ? pressed.dataset.bloomSet : DEFAULTS.f
    };
  }
  // Opening, Body and Signature are all required — Create link stays disabled
  // until every one of them has more than just whitespace in it.
  function updateCreateEnabled() {
    const filled = [fieldOpen, fieldBody, fieldSign].every(el => el.value.trim().length > 0);
    composeCreateBtn.disabled = !filled;
  }
  function updateLivePreview() {
    clampField(fieldOpen, OPEN_MAX);
    clampField(fieldBody, BODY_MAX);
    clampField(fieldSign, SIGN_MAX);
    updateCount(fieldOpen, countOpen, OPEN_MAX);
    updateCount(fieldBody, countBody, BODY_MAX);
    updateCount(fieldSign, countSign, SIGN_MAX);
    updateCreateEnabled();
    render(composedConfig());               // one global config: this also redraws the
  }                                          // hidden main sheet, which is why closing
                                              // the modal has to restore it (see below)
  [fieldOpen, fieldBody, fieldSign].forEach(el => el.addEventListener('input', updateLivePreview));

  /* Reads back whatever is currently on the page — DEFAULTS or a decoded
     shared letter — so cancelling the modal restores it exactly. */
  function currentRenderedConfig() {
    const pressed = document.querySelector('[data-bloom-set][aria-pressed="true"]');
    return {
      v: DEFAULTS.v,
      o: document.querySelector('.sr-open').textContent,
      b: document.querySelector('.sr-body').textContent,
      s: document.querySelector('.sr-sign').textContent,
      f: pressed ? pressed.dataset.bloomSet : DEFAULTS.f
    };
  }

  function focusableIn(container) {
    return Array.from(container.querySelectorAll(
      'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null);
  }

  function onComposeKeydown(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeCompose(); return; }
    if (e.key !== 'Tab') return;
    const items = focusableIn(composeModal);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  let restoreFocusTo = null;
  let restoreConfig  = null;

  function openCompose() {
    restoreFocusTo = document.activeElement;
    restoreConfig = currentRenderedConfig();
    composeBackdrop.hidden = false;
    composeModal.hidden = false;
    document.body.classList.add('compose-open');
    document.addEventListener('keydown', onComposeKeydown);
    updateLivePreview();
    fieldOpen.focus();
  }

  function closeCompose() {
    composeModal.hidden = true;
    composeBackdrop.hidden = true;
    composeLinkView.hidden = true;
    composeFormView.hidden = false;
    document.body.classList.remove('compose-open');
    document.removeEventListener('keydown', onComposeKeydown);
    if (restoreConfig) { render(restoreConfig); applyBloom(restoreConfig.f); }
    (restoreFocusTo || writeOwnBtn).focus();
  }

  writeOwnBtn.addEventListener('click', openCompose);
  composeCloseBtn.addEventListener('click', closeCompose);
  composeBackdrop.addEventListener('click', closeCompose);
  /* .compose-modal is a full-viewport flex container stacked above
     .compose-backdrop, so it — not the backdrop — receives clicks in the
     dimmed area outside .compose-panel; close only when it's the target. */
  composeModal.addEventListener('click', e => { if (e.target === composeModal) closeCompose(); });

  /* the preview flower folds on its own, independent of the main scene */
  const previewScene = document.getElementById('previewScene');
  const previewSheet = document.getElementById('previewSheet');
  function togglePreviewFold() {
    const open = !previewSheet.classList.contains('open');
    previewSheet.classList.toggle('open', open);
    previewScene.setAttribute('aria-expanded', String(open));
    previewScene.setAttribute('aria-label', open
      ? 'Open letter. Activate to fold it back into a flower.'
      : 'Preview flower. Activate to unfold it into a letter.');
  }
  previewScene.addEventListener('click', togglePreviewFold);
  previewScene.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePreviewFold(); }
  });

  composeCreateBtn.addEventListener('click', () => {
    const config = sanitize(composedConfig());
    const url = location.origin + location.pathname + '#' + encode(config);
    linkOutput.value = url;
    previewLinkBtn.href = url;
    composeFormView.hidden = true;
    composeLinkView.hidden = false;
    linkOutput.focus();
    linkOutput.select();
  });

  backToEditBtn.addEventListener('click', () => {
    composeLinkView.hidden = true;
    composeFormView.hidden = false;
    fieldOpen.focus();
  });

  let copyStatusTimer = 0;
  copyLinkBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(linkOutput.value);
      copyStatus.textContent = 'Copied!';
    } catch {
      linkOutput.select();                  // Safari-safe fallback: text is ready to Cmd/Ctrl+C
      copyStatus.textContent = 'Selected — press Ctrl/Cmd+C to copy';
    }
    clearTimeout(copyStatusTimer);
    copyStatusTimer = setTimeout(() => { copyStatus.textContent = ''; }, 2500);
  });

  /* the square changes size with the viewport, and Caveat lands late */
  addEventListener('resize', queueRefit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
})();
</script>
</body>
</html>
